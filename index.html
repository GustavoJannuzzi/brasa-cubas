<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2320" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c2582d'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='600' text-anchor='middle' fill='%23f7f1e8'%3Ebc%3C/text%3E%3C/svg%3E" />

    <title>Brasa Cubas | Ateliê de porcelana fria — peças feitas à mão sob encomenda</title>
    <meta
      name="description"
      content="Ateliê de porcelana fria (biscuit) em Foz do Iguaçu, PR. Topos de bolo, arranjos de flores, lembrancinhas e peças decorativas modeladas à mão. Peça um orçamento sem compromisso."
    />
    <!-- Quando houver dominio proprio, descomentar e trocar a URL. Apontar o
         canonical para um endereco que nao existe faz o buscador ignorar a pagina.
    <link rel="canonical" href="https://brasacubas.com.br/" /> -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brasa Cubas | Ateliê de porcelana fria" />
    <meta
      property="og:description"
      content="Entre no ateliê em 3D, conheça as peças e peça seu orçamento."
    />
    <meta property="og:locale" content="pt_BR" />

    <!-- Sem JS o ateliê não monta e a página vira o texto do <noscript> abaixo.
         O body do app é carvão e sem rolagem, e o texto é carvão: medido na
         produção com JS desligado, a tela inteira ficava escura, sem nada
         legível. Fora de @layer, esta regra ganha da base do app. -->
    <noscript>
      <style>
        body {
          overflow: auto;
          background: #f7f1e8;
        }
      </style>
    </noscript>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Conteudo semantico para buscadores e para quem esta sem JS.
         A cena 3D e um canvas, logo invisivel para crawlers/leitores de tela:
         o "modo simples" dentro do app cobre o mesmo conteudo de forma acessivel. -->
    <noscript>
      <main style="font-family: Georgia, serif; max-width: 42rem; margin: 3rem auto; padding: 0 1.5rem; color: #2b2320">
        <h1>Brasa Cubas — Ateliê de porcelana fria</h1>
        <p>
          Peças de porcelana fria (biscuit) modeladas e pintadas à mão, sob encomenda:
          topos de bolo, arranjos de flores, lembrancinhas de festa, porta-joias e peças decorativas.
        </p>
        <h2>Como encomendar</h2>
        <ol>
          <li>Escolha uma peça do catálogo ou descreva sua ideia.</li>
          <li>Envie o pedido de orçamento com data do evento, quantidade e cores.</li>
          <li>Resposta em até 1 dia útil com valor e prazo de produção.</li>
        </ol>
        <h2>Contato</h2>
        <p>WhatsApp (51) 99999-0000 — atelie@brasacubas.com.br</p>
        <p><em>Esta página precisa de JavaScript para exibir o ateliê em 3D.</em></p>
      </main>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
